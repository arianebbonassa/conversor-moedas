<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <label>
            Converter de
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter para
            <select id="currency-select">
                <option value="bitcoin"> ₿ Bitcoin </option>
                <option value="dolar"> $ Dólar Americano</option>
                <option value="libra"> £ Libra </option>
                <option value="euro"> € Euro</option>
            </select>
        </label>

        <label>
            <input class="input-currency" placeholder="R$ 10.000,00">

        </label>

        <label>
            <button class="convert-button">Converter</button>
        </label>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="real-moeda-de-converter">
                <p class="currency"> Real </p>
                <p class="currency-value-to-convert">R$0,00</p>
            </div>


            <img class="arrow-img" src="./assets/arrow.png" alt="seta">

            <div class="currency-box">
                <img src="./assets/bitcoin.png" alt="moeda-a-ser-convertida" id="currency-img">
            </div>
          

            <div>
                <p class="currency" id="currency-name"> Bitcoin </p>
                <p class="currency-value">₿ 0,00</p>
            </div>

        </section>

    </main>

    <script src="./script.js"></script>

</body>

</html>
